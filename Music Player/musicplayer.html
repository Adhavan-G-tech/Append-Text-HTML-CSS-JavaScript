<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="music-container" id="music-container">
    <div class="music-info">
      <h4 id="title">Shape of You</h4>
      <div class="progress-container" id="progress-container">
        <div class="progress" id="progress"></div>
      </div>
    </div>

    <audio id="audio" src="music1.mp3"></audio>

    <div class="img-container">
      <img src="cover1.jpg" alt="music-cover" id="cover">
    </div>

    <div class="navigation">
      <button id="prev" class="action-btn">⏮️</button>
      <button id="play" class="action-btn action-btn-big">▶️</button>
      <button id="next" class="action-btn">⏭️</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

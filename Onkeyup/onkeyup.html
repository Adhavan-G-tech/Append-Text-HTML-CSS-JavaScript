<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnKeyUp Example</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>OnKeyUp Event Demo</h1>
    <p>Start typing below — your text will appear live as you type!</p>
  </header>

  <main>
    <input type="text" id="textbox" placeholder="Type something..." onkeyup="onkey()">
    <h1 id="result"></h1>
  </main>

        <i class="fa-solid fa-envelope"></i>
        <a href="mailto:adhavangovi@gmail.com">Email</a>
      </div>
      <div class="logo">
        <i class="fa-brands fa-github"></i>
        <a href="https://github.com/Adhavan-G-tech">GitHub</a>
      </div>
      <div class="logo">
        <i class="fa-brands fa-linkedin"></i>
        <a href="http://www.linkedin.com/in/adhavan-g-10m">LinkedIn</a>
      </div>
    </div>
  </footer>

  <!-- JS -->
  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>✊📄✂️ Rock Paper Scissors</h1>
    <div class="choices">
      <button class="choice" id="rock">✊ Rock</button>
      <button class="choice" id="paper">📄 Paper</button>
      <button class="choice" id="scissors">✂️ Scissors</button>
    </div>

    <div class="result">
      <p>You choose: <span id="user-choice">-</span></p>
      <p>Computer choose: <span id="computer-choice">-</span></p>
      <h2 id="outcome">Let's Play!</h2>
    </div>

    <button id="reset-btn">Reset</button>
  </div>

  <script src="script.js"></script>
</body>
</html>

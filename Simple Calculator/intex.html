<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <!-- My CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="calculator">
    <h1><i class="fa-solid fa-calculator"></i> Simple Calculator</h1>

    <div class="inputs">
      <input id="num1" type="number" placeholder="Enter number 1">
      <input id="num2" type="number" placeholder="Enter number 2">
    </div>

    <div class="buttons">
      <button onclick="calculate('+')"><i class="fa-solid fa-plus"></i> Add</button>
      <button onclick="calculate('-')"><i class="fa-solid fa-minus"></i> Sub</button>
      <button onclick="calculate('*')"><i class="fa-solid fa-xmark"></i> Mul</button>
      <button onclick="calculate('/')"><i class="fa-solid fa-divide"></i> Div</button>
    </div>

    <h2 id="tot">Total: 0</h2>
  </div>

  <footer>
    <p>Designed by <strong>Adhavan G</strong> | <i class="fa-solid fa-bolt"></i> Fast & Simple</p>
  </footer>

  <!-- My JS -->
  <script src="script.js"></script>
</body>

</html>
